name: Ошибка
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали, что ожидали и что получилось. Скриншот очень поможет.
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Какая версия программы
      options:
        - С окном (FastWord-gui)
        - Для терминала (FastWord)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Система
      placeholder: Windows 11 / Arch Linux / …
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Номер версии
      placeholder: 0.3.4
