[package]
name = "fastword"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "FastWord — лёгкий тренажёр слепой печати (RU/EN): терминал и окно"

[features]
default = ["tui", "gui"]
tui = ["dep:crossterm"]
gui = ["dep:eframe"]

[dependencies]
crossterm = { version = "0.28", optional = true }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[[bin]]
name = "fastword"
path = "src/bin/fastword.rs"
required-features = ["tui"]

[[bin]]
name = "fastword-gui"
path = "src/bin/fastword-gui.rs"
required-features = ["gui"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
